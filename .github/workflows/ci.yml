name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Record revision
        run: |
          mkdir -p output
          git rev-parse HEAD | tee output/source-revision.txt
          node --version | tee output/node-version.txt
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee output/verification.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 30
