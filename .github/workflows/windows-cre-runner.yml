name: Windows CRE and offline ZIP verification
on:
  push:
    branches: [main]
    paths:
      - scripts/cre-windows-runner.ps1
      - scripts/cre-windows-resume.ps1
      - .github/workflows/windows-cre-runner.yml
      - test/browser-export.test.mjs
  pull_request:
    paths:
      - scripts/cre-windows-runner.ps1
      - scripts/cre-windows-resume.ps1
      - .github/workflows/windows-cre-runner.yml
      - test/browser-export.test.mjs
permissions:
  contents: read
jobs:
  syntax:
    name: Windows PowerShell parser validation
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse runner using Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($scriptName in @('scripts/cre-windows-runner.ps1', 'scripts/cre-windows-resume.ps1')) {
              $scriptPath = Join-Path $PWD $scriptName
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Host ("PARSE ERROR in " + $scriptName + ": " + $_.ToString()) }
                  exit 1
              }
              Write-Host "VALID: $scriptName"
          }
          Write-Host 'Windows PowerShell 5.1: runner syntax valid'
      - name: Parse runner using PowerShell 7
        shell: pwsh
        run: |
          foreach ($scriptName in @('scripts/cre-windows-runner.ps1', 'scripts/cre-windows-resume.ps1')) {
              $scriptPath = Join-Path $PWD $scriptName
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Host ("PARSE ERROR in " + $scriptName + ": " + $_.ToString()) }
                  exit 1
              }
              Write-Host "VALID: $scriptName"
          }
          Write-Host 'PowerShell 7: runner syntax valid'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Verify portable browser ZIP export and offline CLI replay on Windows
        shell: powershell
        run: |
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node.exe --disable-warning=ExperimentalWarning --experimental-strip-types --test test/browser-export.test.mjs
          exit $LASTEXITCODE
