name: Optional public Sepolia inspect smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'capture/inspect-smoke-*'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # Public keyless endpoint documented at:
      # https://docs.tenderly.co/node-rpc/overview#public-endpoint-limits
      AFTERCHECK_RPC_URL: https://sepolia.gateway.tenderly.co
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Record source revision
        run: |
          git rev-parse HEAD
          node --version
      - name: Inspect existing third-party historical swap (read-only)
        run: |
          set -o pipefail
          npm run cli -- inspect \
            0x608ca58e7d01dbe0c7fe48af8c0bb9f2bddcf07ccc36f5c28d033bc8d198d5e9 \
            examples/sepolia/policy-pass.json output/live-inspect
      - name: Independently replay the saved output
        run: node scripts/check-public-example-inspection.mjs output/live-inspect
      - name: Retain inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/live-inspect/
          if-no-files-found: warn
          retention-days: 14
