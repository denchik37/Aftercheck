name: Capture public Sepolia evidence

on:
  push:
    branches:
      - 'capture/**'
  workflow_dispatch:
    inputs:
      transaction_hash:
        description: Existing Sepolia transaction to inspect (read-only)
        required: true
        type: string
        default: '0x608ca58e7d01dbe0c7fe48af8c0bb9f2bddcf07ccc36f5c28d033bc8d198d5e9'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Record source revision
        run: |
          git rev-parse HEAD
          node --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect existing public transaction
        env:
          AFTERCHECK_TRANSACTION_HASH: ${{ inputs.transaction_hash || '0x608ca58e7d01dbe0c7fe48af8c0bb9f2bddcf07ccc36f5c28d033bc8d198d5e9' }}
        run: node scripts/capture-example.mjs "$AFTERCHECK_TRANSACTION_HASH"
      - name: Retain captured evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sepolia-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/captured-evidence.json
          if-no-files-found: error
          retention-days: 30
